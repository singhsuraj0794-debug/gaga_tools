<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>gajab.com — Synthetic Monitoring</title>
<style>
  :root { --bg: #0f172a; --card: #1e293b; --border: #334155; --text: #e2e8f0; --muted: #94a3b8; --green: #22c55e; --red: #ef4444; --yellow: #eab308; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); padding: 24px; }
  h1 { font-size: 1.5rem; margin-bottom: 4px; }
  .subtitle { color: var(--muted); font-size: 0.875rem; margin-bottom: 24px; }
  .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .stat { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; text-align: center; }
  .stat .value { font-size: 2rem; font-weight: 700; }
  .stat .label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px; }
  .green { color: var(--green); } .red { color: var(--red); } .yellow { color: var(--yellow); }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
  .card h3 { font-size: 0.875rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); margin-bottom: 12px; }
  .metric-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 0.875rem; }
  .metric-row:last-child { border-bottom: none; }
  .metric-row .badge { font-size: 0.7rem; padding: 2px 8px; border-radius: 4px; font-weight: 600; }
  .badge.pass { background: rgba(34,197,94,0.15); color: var(--green); }
  .badge.fail { background: rgba(239,68,68,0.15); color: var(--red); }
  .badge.degraded { background: rgba(234,179,8,0.15); color: var(--yellow); }
  .recent { margin-top: 24px; }
  .recent table { width: 100%; border-collapse: collapse; font-size: 0.8125rem; }
  .recent th, .recent td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--border); }
  .recent th { color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; font-size: 0.7rem; }
  .loading { text-align: center; padding: 48px; color: var(--muted); }
  .error { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); border-radius: 8px; padding: 16px; margin-bottom: 16px; color: var(--red); }
</style>
</head>
<body>
  <h1>gajab.com Synthetic Monitoring</h1>
  <p class="subtitle">Real-time dashboard — <span id="last-refresh">loading...</span></p>

  <div id="error-container"></div>

  <div class="summary" id="summary"></div>

  <div class="cards" id="cards"></div>

  <div class="recent">
    <h3 style="margin-bottom:8px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;font-size:0.75rem;">Recent Runs</h3>
    <div id="recent-table"></div>
  </div>

<script>
const SUPABASE_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
  ? localStorage.getItem('supabase_url') || ''
  : '__SUPABASE_URL__';
const SUPABASE_KEY = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
  ? localStorage.getItem('supabase_key') || ''
  : '__SUPABASE_KEY__';

async function fetchRuns() {
  if (!SUPABASE_URL || !SUPABASE_KEY) {
    document.getElementById('error-container').innerHTML = '<div class="error">Supabase not configured. Set SUPABASE_URL and SUPABASE_KEY, or use ?supabaseUrl=...&supabaseKey=... query params.</div>';
    return [];
  }
  const url = new URL(`${SUPABASE_URL}/rest/v1/monitoring_runs`);
  url.searchParams.set('select', '*');
  url.searchParams.set('order', 'run_at.desc');
  url.searchParams.set('limit', '200');
  try {
    const resp = await fetch(url.toString(), {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
    });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}: ${resp.statusText}`);
    return await resp.json();
  } catch (e) {
    document.getElementById('error-container').innerHTML = `<div class="error">Failed to fetch data: ${e.message}</div>`;
    return [];
  }
}

function buildDashboard(runs) {
  document.getElementById('last-refresh').textContent = `last refreshed: ${new Date().toLocaleString()}`;

  if (runs.length === 0) {
    document.getElementById('cards').innerHTML = '<div class="loading">No monitoring runs found yet.</div>';
    return;
  }

  // Summary stats
  const latestRunAt = runs[0].run_at;
  const totalRuns = new Set(runs.map(r => r.run_at)).size;
  const latestRuns = runs.filter(r => r.run_at === latestRunAt);
  const passCount = latestRuns.filter(r => r.status === 'pass').length;
  const failCount = latestRuns.filter(r => r.status === 'fail').length;
  const degradedCount = latestRuns.filter(r => r.status === 'degraded').length;

  document.getElementById('summary').innerHTML = `
    <div class="stat"><div class="value ${totalRuns > 0 ? 'green' : ''}">${totalRuns}</div><div class="label">Total Runs</div></div>
    <div class="stat"><div class="value ${passCount > 0 ? 'green' : ''}">${passCount}</div><div class="label">Passing (latest)</div></div>
    <div class="stat"><div class="value ${failCount > 0 ? 'red' : ''}">${failCount}</div><div class="label">Failing (latest)</div></div>
    <div class="stat"><div class="value ${degradedCount > 0 ? 'yellow' : ''}">${degradedCount}</div><div class="label">Degraded (latest)</div></div>
  `;

  // Group by page/flow
  const byPage = {};
  for (const r of runs) {
    if (!byPage[r.page]) byPage[r.page] = {};
    if (!byPage[r.page][r.metric]) byPage[r.page][r.metric] = [];
    byPage[r.page][r.metric].push(r);
  }

  let cardsHtml = '';
  for (const [page, metrics] of Object.entries(byPage)) {
    const pageLatest = runs.filter(r => r.page === page && r.run_at === latestRunAt);
    const pageStatus = pageLatest.some(r => r.status === 'fail') ? 'fail' : pageLatest.some(r => r.status === 'degraded') ? 'degraded' : 'pass';

    let metricsHtml = '';
    for (const [metric, entries] of Object.entries(metrics)) {
      const latest = entries[0];
      const val = latest.value != null ? latest.value.toLocaleString() + (metric.includes('ms') ? ' ms' : metric.includes('score') ? '%' : '') : '—';
      const badge = `<span class="badge ${latest.status}">${latest.status}</span>`;
      metricsHtml += `<div class="metric-row"><span>${metric}</span><span>${val} ${badge}</span></div>`;
    }

    cardsHtml += `
      <div class="card">
        <h3>${page} <span class="badge ${pageStatus}" style="float:right">${pageStatus}</span></h3>
        ${metricsHtml}
      </div>
    `;
  }
  document.getElementById('cards').innerHTML = cardsHtml;

  // Recent runs table
  const latest20 = runs.slice(0, 100);
  let tableHtml = `<table><thead><tr><th>Time</th><th>Page</th><th>Metric</th><th>Value</th><th>Status</th><th>Error</th></tr></thead><tbody>`;
  for (const r of latest20) {
    const time = new Date(r.run_at).toLocaleString();
    const val = r.value != null ? r.value.toLocaleString() : '—';
    tableHtml += `<tr>
      <td style="white-space:nowrap">${time}</td>
      <td>${r.page}</td>
      <td>${r.metric}</td>
      <td>${val}</td>
      <td><span class="badge ${r.status}">${r.status}</span></td>
      <td style="color:var(--muted);max-width:200px;overflow:hidden;text-overflow:ellipsis">${r.step_failed || '—'}</td>
    </tr>`;
  }
  tableHtml += '</tbody></table>';
  document.getElementById('recent-table').innerHTML = tableHtml;
}

async function init() {
  // Parse query params for supabase config (local dev)
  const params = new URLSearchParams(window.location.search);
  if (params.get('supabaseUrl')) localStorage.setItem('supabase_url', params.get('supabaseUrl'));
  if (params.get('supabaseKey')) localStorage.setItem('supabase_key', params.get('supabaseKey'));

  const runs = await fetchRuns();
  buildDashboard(runs);
  setInterval(async () => {
    const newRuns = await fetchRuns();
    buildDashboard(newRuns);
  }, 30000);
}

init();
</script>
</body>
</html>
