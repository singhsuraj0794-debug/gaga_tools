name: Gajab.com Happy Flow Monitor
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright + deps
        run: |
          pip install playwright
          python3 -m playwright install chromium
          python3 -m playwright install-deps chromium
      - name: Run happy flow check
        id: check
        run: |
          python3 scripts/happy_flow_checker.py > /tmp/check_output.txt 2>&1
          cat /tmp/check_output.txt
          JSON=$(cat /tmp/check_output.txt | grep '^{')
          echo "result=$JSON" >> $GITHUB_OUTPUT
      - name: Post result to Render API
        run: |
          curl -s -X POST "https://product-video-scraper-api.onrender.com/api/monitor/results" \
            -H "Content-Type: application/json" \
            -d '${{ steps.check.outputs.result }}' \
            --max-time 10
      - name: Notify on failure
        if: failure()
        run: |
          curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"text":"🚨 Gajab.com Happy Flow check FAILED — see https://product-video-scraper-api.onrender.com/api/monitor/results"}'
          curl -s -X POST "https://api.twilio.com/2010-04-01/Accounts/${{ secrets.TWILIO_SID }}/Messages.json" \
            --data-urlencode "To=${{ secrets.MONITOR_PHONE }}" \
            --data-urlencode "From=+14755968037" \
            --data-urlencode "Body=Gajab.com happy flow check FAILED" \
            -u "${{ secrets.TWILIO_SID }}:${{ secrets.TWILIO_AUTH_TOKEN }}"
