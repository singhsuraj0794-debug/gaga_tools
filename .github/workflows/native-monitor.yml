name: Native App Monitor

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:

jobs:
  native-android:
    # Interim: run on the Mac runner (mac-india), which has the gajab_pixel7
    # AVD + logged-in app. It was retargeted to [self-hosted, windows-india] as
    # part of the Windows migration, but that runner is not registered yet and
    # the Windows emulator still needs a Hyper-V reboot + the app APK, so the job
    # sat queued forever and the Android check stopped running. Switch back to
    # windows-india once the Windows emulator is verified.
    runs-on: [self-hosted, mac-india]
    steps:
      - uses: actions/checkout@v5

      - name: Start emulator + Appium and run native happy flow
        run: bash start-native-monitor.sh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

  notify-failure:
    if: ${{ always() && needs.native-android.result == 'failure' }}
    runs-on: ubuntu-latest
    needs: [native-android]
    steps:
      - name: Slack alert on native job failure
        run: |
          curl -s -X POST "$SLACK_WEBHOOK_URL" -H "Content-Type: application/json" \
            -d "{\"text\":\"<!channel> ❌ *Native App Monitor job FAILED* (run ${{ github.run_number }})\nAndroid monitoring wrote no data this cycle. Most recent failure cause: runner/checkout crash or emulator/Appium error.\nLogs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
