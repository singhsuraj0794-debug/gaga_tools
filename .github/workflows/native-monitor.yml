name: Native App Monitor

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:

jobs:
  native-android:
    runs-on: [self-hosted, mac-india]
    steps:
      - uses: actions/checkout@v5

      - name: Start emulator + Appium and run native happy flow
        run: bash start-native-monitor.sh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
