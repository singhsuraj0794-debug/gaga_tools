name: Synthetic Monitor

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  monitor-india:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v5

      - name: Install Python deps
        run: pip3 install -r monitoring/requirements.txt

      - name: Run monitor (health + API)
        run: python3 monitoring/run_monitor.py
        env:
          MONITOR_MODE: health
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TWILIO_SID: ${{ secrets.TWILIO_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          MONITOR_PHONE: ${{ secrets.MONITOR_PHONE }}

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: monitoring/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python deps
        run: pip install -r monitoring/requirements.txt

      - name: Install Lighthouse CLI
        run: |
          cd monitoring
          npm install lighthouse

      - name: Install Playwright browsers
        run: |
          playwright install-deps chromium
          playwright install chromium

      - name: Download saved session from Supabase
        run: |
          curl -s -o monitoring/.gajab_session.json \
            "https://okxyskmjsmtykblrtmyi.supabase.co/storage/v1/object/public/monitoring/gajab_session.json" \
            --max-time 15 || echo "No session file available"
          if [ -f monitoring/.gajab_session.json ] && [ -s monitoring/.gajab_session.json ]; then
            echo "Session restored ($(wc -c < monitoring/.gajab_session.json) bytes)"
          fi

      - name: Run monitor (lighthouse + happy flow + feature)
        run: python monitoring/run_monitor.py
        env:
          MONITOR_MODE: browser
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
