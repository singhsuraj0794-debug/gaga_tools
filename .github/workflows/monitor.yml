name: Synthetic Monitor

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 min — GitHub merges/drops scheduled ticks under load; doubling cadence restores ~hourly coverage
  workflow_dispatch:

jobs:
  # Decide where each job can actually run. The India self-hosted runner is
  # offline most of the time, and a job pinned to it simply never ran (11 hours
  # of data in 7 days). Health/API checks fall back to a GitHub-hosted runner and
  # record which vantage point produced the numbers.
  runner-check:
    runs-on: ubuntu-latest
    outputs:
      windows_online: ${{ steps.check.outputs.windows_online }}
      linux_online: ${{ steps.check.outputs.linux_online }}
      linux_labels: ${{ steps.check.outputs.linux_labels }}
    steps:
      - name: Check which self-hosted runners are online
        id: check
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          REPO: ${{ github.repository }}
        run: python3 monitoring/runner_status.py >> "$GITHUB_OUTPUT"

  monitor-india:
    needs: runner-check
    runs-on: ${{ fromJSON(needs.runner-check.outputs.linux_labels) }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Python deps
        run: pip3 install -r monitoring/requirements.txt

      - name: Run monitor (health + API)
        run: python3 monitoring/run_monitor.py
        env:
          MONITOR_MODE: health
          MONITOR_RUN_ID: ${{ github.run_id }}
          # Which vantage point these latencies were measured from. A US run must
          # never be compared against an India one.
          MONITOR_VANTAGE: ${{ needs.runner-check.outputs.linux_online == 'true' && 'india' || 'us' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

  lighthouse-india:
    needs: runner-check
    if: needs.runner-check.outputs.windows_online == 'true'
    runs-on: [self-hosted, windows-india]
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python venv
        shell: pwsh
        run: |
          py -3.11 -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -q -r monitoring/requirements.txt

      - name: Install Lighthouse
        shell: pwsh
        run: |
          Set-Location monitoring
          npm install lighthouse

      - name: Run Lighthouse from India (Windows)
        shell: pwsh
        run: .\.venv\Scripts\python.exe monitoring/run_monitor.py
        env:
          MONITOR_MODE: lighthouse
          MONITOR_RUN_ID: ${{ github.run_id }}
          MONITOR_VANTAGE: india
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

  lighthouse-us:
    needs: runner-check
    if: needs.runner-check.outputs.windows_online != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: monitoring/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python deps
        run: pip install -r monitoring/requirements.txt

      - name: Install Lighthouse CLI
        run: |
          cd monitoring
          npm install lighthouse

      - name: Run Lighthouse from US
        run: python monitoring/run_monitor.py
        env:
          MONITOR_MODE: lighthouse
          MONITOR_RUN_ID: ${{ github.run_id }}
          MONITOR_VANTAGE: us
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: monitoring/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python deps
        run: pip install -r monitoring/requirements.txt

      - name: Install Playwright browsers
        run: |
          playwright install-deps chromium
          playwright install chromium

      - name: Download saved session
        run: |
          # The session is published to Supabase Storage on whichever stack the
          # secrets point at; try that origin first, then the box tunnel, and make
          # a missing session an INFRA condition (the run then records it instead
          # of reporting a false product failure).
          set +e
          for base in "${{ secrets.SUPABASE_URL }}" \
                      "https://unneeded-taps-unharmed.ngrok-free.dev"; do
            code=$(curl -s -o monitoring/.gajab_session.json -w "%{http_code}" \
              -H "ngrok-skip-browser-warning: 1" --max-time 20 \
              "$base/storage/v1/object/public/monitoring/gajab_session.json")
            if [ "$code" = "200" ] && [ -s monitoring/.gajab_session.json ]; then
              echo "Session restored from $base ($(wc -c < monitoring/.gajab_session.json) bytes)"
              exit 0
            fi
          done
          rm -f monitoring/.gajab_session.json
          echo "::warning::No saved session available - browser checks will report a session-missing INFRA failure, not a product failure"

      - name: Run monitor (happy flow + feature)
        run: python monitoring/run_monitor.py
        env:
          MONITOR_MODE: browser
          MONITOR_RUN_ID: ${{ github.run_id }}
          MONITOR_VANTAGE: us
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

  notify-failure:
    # `needs.result` is not a thing; a job-level needs map must be inspected with
    # contains(), otherwise this never fired.
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    needs: [monitor-india, runner-check, lighthouse-india, lighthouse-us, browser]
    steps:
      - name: Slack alert on workflow job failure
        run: |
          curl -s -X POST "$SLACK_WEBHOOK_URL" -H "Content-Type: application/json" \
            -d "{\"text\":\"*Synthetic Monitor job FAILED* (run ${{ github.run_number }}). A job crashed before run_monitor.py could write results. Logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
