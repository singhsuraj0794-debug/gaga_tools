name: Synthetic Monitor

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  monitor-india:
    runs-on: [self-hosted, Linux]
    steps:
      - uses: actions/checkout@v5

      - name: Install Python deps
        run: pip3 install -r monitoring/requirements.txt

      - name: Run monitor (health + API)
        run: python3 monitoring/run_monitor.py
        env:
          MONITOR_MODE: health
          MONITOR_RUN_ID: ${{ github.run_id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

  runner-check:
    runs-on: ubuntu-latest
    outputs:
      mac_online: ${{ steps.check.outputs.mac_online }}
    steps:
      - name: Check if Mac runner is online
        id: check
        run: |
          online=$(curl -s -H "Authorization: Bearer ${{ secrets.GH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runners?per_page=100" \
            | python3 -c "import sys,json; rs=json.load(sys.stdin).get('runners',[]); print('true' if any(r.get('name')=='gajab-mac' and r.get('status')=='online' for r in rs) else 'false')")
          echo "mac_online=$online" >> "$GITHUB_OUTPUT"
          echo "Mac runner online: $online"

  lighthouse-india:
    needs: runner-check
    if: needs.runner-check.outputs.mac_online == 'true'
    runs-on: [self-hosted, mac-india]
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python venv
        run: |
          python3.11 -m venv .venv 2>/dev/null || python3 -m venv .venv
          .venv/bin/pip install -q -r monitoring/requirements.txt

      - name: Install Lighthouse
        run: cd monitoring && npm install lighthouse

      - name: Run Lighthouse from India (Mac)
        run: .venv/bin/python monitoring/run_monitor.py
        env:
          MONITOR_MODE: lighthouse
          MONITOR_RUN_ID: ${{ github.run_id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

  lighthouse-us:
    needs: runner-check
    if: needs.runner-check.outputs.mac_online != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: monitoring/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python deps
        run: pip install -r monitoring/requirements.txt

      - name: Install Lighthouse CLI
        run: |
          cd monitoring
          npm install lighthouse

      - name: Run Lighthouse from US
        run: python monitoring/run_monitor.py
        env:
          MONITOR_MODE: lighthouse
          MONITOR_RUN_ID: ${{ github.run_id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: monitoring/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python deps
        run: pip install -r monitoring/requirements.txt

      - name: Install Playwright browsers
        run: |
          playwright install-deps chromium
          playwright install chromium

      - name: Download saved session from Supabase
        run: |
          curl -s -o monitoring/.gajab_session.json \
            "https://okxyskmjsmtykblrtmyi.supabase.co/storage/v1/object/public/monitoring/gajab_session.json" \
            --max-time 15 || echo "No session file available"
          if [ -f monitoring/.gajab_session.json ] && [ -s monitoring/.gajab_session.json ]; then
            echo "Session restored ($(wc -c < monitoring/.gajab_session.json) bytes)"
          fi

      - name: Run monitor (happy flow + feature)
        run: python monitoring/run_monitor.py
        env:
          MONITOR_MODE: browser
          MONITOR_RUN_ID: ${{ github.run_id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
