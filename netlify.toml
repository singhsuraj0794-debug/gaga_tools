[build]
  command = "corepack enable && pnpm install && pnpm run build:frontend"
  publish = "artifacts/video-finder/dist"

[[redirects]]
  from = "/api/*"
  to = "https://product-video-scraper-api.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
