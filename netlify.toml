[build]
  command = "pnpm install --ignore-scripts && pnpm run build:frontend"
  publish = "artifacts/video-finder/dist"

[[redirects]]
  from = "/api/*"
  to = "https://YOUR_RENDER_BACKEND.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
